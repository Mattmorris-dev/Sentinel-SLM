# brand.conf — rebrand the bootable USB by editing these values, then rebuild.
# (Sourced by build-iso.sh. Plain shell variables; keep the quotes.)

OS_NAME="Sentinel OS"            # shown in the boot menu, login banner, ISO label
OS_ID="sentinel"                 # hostname + live username (lowercase, no spaces)
PUBLISHER="Pr0xy_22"             # written into the ISO metadata
ISO_VOLUME="SENTINEL"            # volume label (max 32 chars, no spaces)
TAGLINE="Your security analyst that never leaves the box"
MARK="usb/brand-mark.svg"        # repo-relative; the shield used for wallpaper + app icon
BG_COLOR="#0a0f1f"               # wallpaper background
ACCENT="#22d3ee"                 # wallpaper tagline colour
DEBIAN_RELEASE="trixie"          # Debian 13 (current stable)
